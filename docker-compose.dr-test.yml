# DR Replication Test Setup
#
# Three single-node Raft clusters for testing DR replication end-to-end
# (one primary, two independent DR secondaries).
# Use docker-compose.dr-ha-test.yml for the full three-node-per-cluster HA
# topology.
#
# Usage:
#   make docker-dev
#   scripts/dr_local_test.sh reset
#   scripts/dr_local_test.sh smoke --duration 120 --concurrency 24
#   scripts/dr_local_test.sh verify
#   scripts/dr_local_test.sh down
#
# The helper writes root tokens to .dr-test.env, which is ignored by git.

services:
  primary:
    image: openbao:dev
    pull_policy: never
    command: ["server"]
    environment:
      BAO_LOCAL_CONFIG: |
        {
          "storage": {
            "raft": {
              "path": "/openbao/file",
              "node_id": "primary"
            }
          },
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "tls_disable": true,
              "cluster_address": "0.0.0.0:8201"
            }
          }],
          "api_addr": "http://primary:8200",
          "cluster_addr": "https://primary:8201",
          "disable_mlock": true,
          "log_level": "debug"
        }
    ports:
      - "8800:8200"
      - "8801:8201"
    volumes:
      - primary-data:/openbao/file
    cap_add: [IPC_LOCK]
    networks:
      - dr-net

  secondary:
    image: openbao:dev
    pull_policy: never
    command: ["server"]
    environment:
      BAO_LOCAL_CONFIG: |
        {
          "storage": {
            "raft": {
              "path": "/openbao/file",
              "node_id": "secondary"
            }
          },
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "tls_disable": true,
              "cluster_address": "0.0.0.0:8201"
            }
          }],
          "api_addr": "http://secondary:8200",
          "cluster_addr": "https://secondary:8201",
          "disable_mlock": true,
          "log_level": "debug"
        }
    ports:
      - "8900:8200"
      - "8901:8201"
    volumes:
      - secondary-data:/openbao/file
    cap_add: [IPC_LOCK]
    networks:
      - dr-net

  secondary2:
    image: openbao:dev
    pull_policy: never
    command: ["server"]
    environment:
      BAO_LOCAL_CONFIG: |
        {
          "storage": {
            "raft": {
              "path": "/openbao/file",
              "node_id": "secondary2"
            }
          },
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "tls_disable": true,
              "cluster_address": "0.0.0.0:8201"
            }
          }],
          "api_addr": "http://secondary2:8200",
          "cluster_addr": "https://secondary2:8201",
          "disable_mlock": true,
          "log_level": "debug"
        }
    ports:
      - "9000:8200"
      - "9001:8201"
    volumes:
      - secondary2-data:/openbao/file
    cap_add: [IPC_LOCK]
    networks:
      - dr-net

volumes:
  primary-data:
  secondary-data:
  secondary2-data:

networks:
  dr-net:
    driver: bridge
